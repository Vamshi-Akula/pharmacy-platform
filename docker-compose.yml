services:
  mongo:
    image: mongo:7
    container_name: pharmacy-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: pharmacy-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/pharmacy
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  mongo-data:
